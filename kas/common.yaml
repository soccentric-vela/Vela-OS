header:
  version: 14
  includes:
    - repos/poky.yaml
    - repos/meta-arm.yaml
    - repos/meta-openembedded.yaml
    - repos/meta-qcom.yaml
    - repos/meta-swupdate.yaml
    - repos/meta-vela.yaml

distro: poky
target: vela-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # SD card / eMMC image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../cache/downloads"
    SSTATE_DIR ?= "${TOPDIR}/../cache/sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # Swupdate specific variables
    SWUPDATE_INIT = "systemd"

    # Qualcomm proprietary firmware / GPU / DSP binaries are covered by the
    # Qualcomm-Technologies-Inc.-Proprietary licence (meta-qcom). Accept the
    # licences so the BSP firmware can be pulled into the image.
    LICENSE_FLAGS_ACCEPTED:append = " Qualcomm-Technologies-Inc.-Proprietary"

    # Snapdragon boot uses a FIT/DTB image consumed by UEFI + systemd-boot.
    # Keep the default boot.img/UKI path from meta-qcom unless overridden by
    # a board config.
