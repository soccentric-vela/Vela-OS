header:
  version: 14

repos:
  # Vela-Configuration ships its own meta-webconfig Yocto layer (the
  # on-device WebConfig daemon + static frontend + schemas + board
  # manifest). Only that subdirectory is a layer; the rest of the repo
  # (Rust workspace, frontend source) is not needed by the build.
  vela-configuration:
    url: https://github.com/soccentric-vela/Vela-Configuration.git
    branch: develop
    path: meta/vela-configuration
    layers:
      meta-webconfig:
